<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FüKw Dropzone</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/sentry-browser.bundle.min.js"></script>
    <script src="/sentry-init.js"></script>
  </head>
  <body class="page page-login">
    <main class="shell shell-login">
      <section class="hero hero-login">
        <div class="hero-frame">
          <div class="hero-brand login-brand">
            <h1 class="login-title">FüKw Dropzone</h1>
            <p class="brand-caption">Sicherer Dateieingang für externe Unterlagen und interne Freigaben.</p>
          </div>

          <div class="entry-stack login-entry-stack">
            <section class="panel entry-panel login-panel">
              <div class="panel-intro">
                <h2>Zugangscode eingeben</h2>
              </div>

              <p id="welcomeMessage" class="banner" aria-live="assertive" role="alert" hidden></p>

              <form id="tokenAccessForm" class="stack-form">
                <label class="field" for="shareTokenInput">
                  <span class="field-label">Zugangscode oder Freigabelink</span>
                  <input
                    id="shareTokenInput"
                    name="shareToken"
                    type="text"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-describedby="welcomeMessage"
                    placeholder="z. B. dz-k234-5678-abcd oder https://..."
                    required
                  />
                </label>

                <button type="submit" class="primary-btn">Upload öffnen</button>
              </form>
            </section>

            <section class="panel entry-panel login-panel login-panel-secondary">
              <div class="panel-intro">
                <h2>Mit I&amp;K ID anmelden</h2>
              </div>

              <button id="pocketIdLoginBtn" type="button" class="secondary-btn">Login starten</button>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
